<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="CardEdge"><meta name="theme-color" content="#0a0a0a"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png">
<title>CardEdge TCG</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#0a0a0a;--mut:#4d4d4d;--line:#0a0a0a;--acc:#d4af37;--gt:#7a5c00;--accink:#0a0a0a;--pos:#0a7a3d;--neg:#c0262d;--warn:#8a5a00;--soft:#f4efdd;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--card:#141414;--ink:#f5f5f5;--mut:#b8b8b8;--line:#d4af37;--acc:#d4af37;--gt:#e6c75a;--accink:#0a0a0a;--pos:#4fd68a;--neg:#ff7a80;--warn:#ffc04d;--soft:#2a2512;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--card:#141414;--ink:#f5f5f5;--mut:#b8b8b8;--line:#d4af37;--acc:#d4af37;--gt:#e6c75a;--accink:#0a0a0a;--pos:#4fd68a;--neg:#ff7a80;--warn:#ffc04d;--soft:#2a2512;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0a0a0a;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#0a0a0a;color:#fff;border-bottom:3px solid #d4af37;padding:12px 16px;display:flex;justify-content:space-between;align-items:baseline}
header b{font-size:22px;letter-spacing:-.02em;color:#d4af37}header span{font-size:14px;opacity:.8}
main{padding:14px 14px 110px;max-width:640px;margin:0 auto}
h2{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}h3{font-size:17px;margin:0 0 8px}
.c{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:14px;font-weight:600;color:var(--mut);margin:0 0 4px}
input,select,textarea{width:100%;min-height:48px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{min-height:120px;font:14px/1.3 ui-monospace,Menlo,monospace}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.f{margin-bottom:10px}
button,.btn{min-height:48px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc)}button.d{border-color:var(--neg);color:var(--neg)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.row>*{flex:1 1 auto}
.chip{min-width:64px}.chip.on{background:var(--ink);color:var(--bg)}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.k{font-size:13px;color:var(--mut);font-weight:600}
.pos{color:var(--pos)}.neg{color:var(--neg)}.warn{color:var(--warn)}.mut{color:var(--mut);font-size:14px}
.item{border-top:1.5px solid var(--line);padding:10px 0;cursor:pointer}.item:first-child{border-top:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft);margin-right:4px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-variant-numeric:tabular-nums}
.conf{display:inline-block;font-weight:800;padding:4px 12px;border-radius:99px;border:2px solid currentColor}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1.5px solid var(--line);display:grid;grid-template-columns:repeat(7,1fr);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:none;min-height:54px;font-size:12px;padding:4px 0;flex-direction:column;gap:2px;color:var(--mut)}
nav button i{font-style:normal;font-size:20px}nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 #d4af37}nav button.on i{color:var(--gt)}
#modal{position:fixed;inset:0;background:rgba(5,8,20,.6);z-index:20;display:none;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 30px}
#modal .c{max-width:620px;margin:0 auto}
#toast{position:fixed;left:12px;right:12px;bottom:90px;z-index:30;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;display:none;font-weight:600}
.thumb{width:48px;height:67px;object-fit:cover;border-radius:5px;border:1px solid var(--line);background:var(--soft);flex:none}.sr{display:flex;gap:12px;align-items:center}.big-img{width:100%;max-width:340px;display:block;margin:0 auto 10px;border-radius:12px;background:var(--soft);min-height:200px}
@keyframes sh{to{background-position:-200% 0}}.sk{background:linear-gradient(90deg,var(--soft) 25%,var(--line) 50%,var(--soft) 75%);background-size:200% 100%;animation:sh 1.3s linear infinite;border-radius:8px}@media(prefers-reduced-motion:reduce){.sk{animation:none}}
#toast button{margin-left:12px;min-height:36px;padding:2px 14px;background:#d4af37;color:#0a0a0a;border-color:#d4af37}.bk{background:var(--soft);border-color:#d4af37}
#seller{display:none;position:fixed;inset:0;z-index:40;background:#000;color:#fff;text-align:center;padding:calc(36px + env(safe-area-inset-top,0px)) 20px calc(36px + env(safe-area-inset-bottom,0px));overflow:auto}
.lotrow{transition:transform .15s}
a{color:var(--gt)}.chk{display:flex;gap:10px;align-items:center;min-height:44px}.chk input{width:26px;min-height:26px;flex:none}
</style></head><body>
<header><b>CardEdge</b><span id="net">315TCG</span></header>
<main id="main"></main><nav id="nav"></nav><div id="modal"></div><div id="toast" role="status"></div><div id="seller" data-a="sellclose"></div><datalist id="setlist"></datalist>
<script>
const K='cardedge_tcg_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v??'').replace(/[$,%\s]/g,''));return isFinite(n)?n:NaN};
const n0=v=>isFinite(num(v))?num(v):0;
const money=n=>isFinite(n)?(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'—';
const sgn=n=>`<span class="${n>=0?'pos':'neg'}">${money(n)}</span>`;
const today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let S={inv:[],tx:[]};
try{const r=JSON.parse(localStorage.getItem(K)||'null');if(r&&Array.isArray(r.inv))S={inv:r.inv,tx:r.tx||[]}}catch(e){}
let META={changes:0,last:0},PERSISTED=null,UNDO=null;try{Object.assign(META,JSON.parse(localStorage.getItem('cardedge_meta_v1')||'{}'))}catch(e){}
const saveMeta=()=>{try{localStorage.setItem('cardedge_meta_v1',JSON.stringify(META))}catch(e){}};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('Could not save in this browser. Copy a backup from the Data tab.')}META.changes++;saveMeta()}
function toast(m,undo){const t=$('#toast');UNDO=undo||null;t.innerHTML=esc(m)+(undo?'<button data-a="undo">Undo</button>':'');t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',undo?8000:3500)}
const copyText=t=>{try{navigator.clipboard.writeText(t).catch(()=>{})}catch(e){}const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove()};
const median=a=>{if(!a.length)return NaN;a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
const P={mode:'buy',buy:{name:'',mv:'',pct:'70',adj:''},sell:{name:'',price:'',cost:'',prof:'ebay',fee:'13.25',fix:'0.30',ship:'',sup:'',margin:'20'},
pr:{type:'raw',name:'',set:'',num:'',co:'PSA',grade:'10',tcg:'',pc:'',guide:'',comps:[],bin:[]},
trade:{give:[],get:[],pg:'100',pt:'80',chk:[0,0,0,0,0]},inv:{q:'',f:'all',s:'recent'},arm:'',data:''};
const gp=p=>p.split('.').reduce((o,k)=>o[k],P);
const sp=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],P)[l]=v};
const SETS=[['Mega Evolution','Mega Evolution'],['Phantasmal Flames','Mega Evolution'],['Ascended Heroes','Mega Evolution'],['Perfect Order','Mega Evolution'],['Chaos Rising','Mega Evolution'],['White Flare','Scarlet & Violet',173],['Black Bolt','Scarlet & Violet',172],['Destined Rivals','Scarlet & Violet',244],['Journey Together','Scarlet & Violet',190],['Prismatic Evolutions','Scarlet & Violet',180],['Surging Sparks','Scarlet & Violet',252],['Stellar Crown','Scarlet & Violet',175],['Shrouded Fable','Scarlet & Violet',99],['Twilight Masquerade','Scarlet & Violet',226],['Temporal Forces','Scarlet & Violet',218],['Paldean Fates','Scarlet & Violet',245],['Paradox Rift','Scarlet & Violet',266],['151','Scarlet & Violet',207],['Obsidian Flames','Scarlet & Violet',230],['Paldea Evolved','Scarlet & Violet',279],['Scarlet & Violet','Scarlet & Violet',258],['Crown Zenith','Sword & Shield',160],['Silver Tempest','Sword & Shield',215],['Lost Origin','Sword & Shield',217],['Pokémon GO','Sword & Shield',88],['Astral Radiance','Sword & Shield',216],['Brilliant Stars','Sword & Shield',186],['Fusion Strike','Sword & Shield',284],['Celebrations','Sword & Shield',25],['Evolving Skies','Sword & Shield',237],['Chilling Reign','Sword & Shield',233],['Battle Styles','Sword & Shield',183],['Shining Fates','Sword & Shield',73],['Vivid Voltage','Sword & Shield',203]];
$('#setlist').innerHTML=SETS.map(s=>`<option value="${esc(s[0])}">${esc(s[1])}${s[2]?' · '+s[2]+' total':''}</option>`).join('');
const setInfo=n=>{const s=SETS.find(x=>x[0].toLowerCase()===String(n).trim().toLowerCase());return s?'Set found: '+s[1]+(s[2]?', '+s[2]+' cards including secret rares (the printed number is smaller)':''):''};
const FEES={ebay:['eBay (default 13.25% + $0.30)',13.25,.3],tcg:['TCGplayer (default 12.75% + $0.30)',12.75,.3],cash:['Card show, cash (0%)',0,0],card:['Card show, card reader (default 2.6% + $0.10)',2.6,.1],custom:['Custom',null,null]};
const inp=(path,label,o={})=>`<div class="f"><label>${label}</label><input data-s="${path}" value="${esc(gp(path))}" ${o.t?`type="${o.t}"`:`inputmode="${o.m||'decimal'}"`} placeholder="${o.ph||''}" ${o.list?'list="setlist"':''} autocomplete="off"></div>`;
const sel=(path,label,opts)=>`<div class="f"><label>${label}</label><select data-s="${path}">${opts.map(o=>`<option ${gp(path)==o?'selected':''}>${o}</option>`).join('')}</select></div>`;
const kv=(k,v,b)=>`<div class="kv"><span>${k}</span><span ${b?'style="font-weight:800"':''}>${v}</span></div>`;

/* ---------- views ---------- */
const V={};
V.dash=()=>{let val=0,cost=0,q=0,miss=0,mc=0;S.inv.forEach(i=>{const n=n0(i.qty)||1;q+=n;cost+=n*n0(i.cost);if(num(i.market)>0){val+=n*num(i.market);mc+=n*n0(i.cost)}else miss++});
const real=S.tx.filter(t=>t.type==='sell').reduce((a,t)=>a+n0(t.profit),0);
return `<h2>Overview</h2><div class="c"><div class="k">Collection value (your entered market values)</div><div class="big">${money(val)}</div>
${kv('Cost basis (all cards)',money(cost))}${kv('Unrealized P/L (priced cards)',sgn(val-mc))}${kv('Realized profit (logged sales)',sgn(real))}${kv('Cards / entries',q+' / '+S.inv.length)}
${miss?`<p class="mut">${miss} entr${miss>1?'ies have':'y has'} no market value and ${miss>1?'are':'is'} left out of value and P/L.</p>`:''}</div>
<div class="row"><button class="p" data-a="tab" data-v="price">Price a card</button><button data-a="tab" data-v="vendor">Offer calculator</button></div>
<div class="c"><h3>Recent activity</h3>${S.tx.length?S.tx.slice(-6).reverse().map(t=>`<div class="item" style="cursor:default"><b>${esc(t.type==='trade'?'Trade':t.type==='buy'?'Purchase':'Sale')}</b> ${esc(t.name||'')} <span class="mut">${esc(t.date)}</span><br><span class="mut">${esc(t.note||'')}</span></div>`).join(''):'<p class="mut">No transactions yet. Log purchases, sales and trades from the Offer and Trade tabs.</p>'}</div>
<p class="mut">Values here come from what you enter or save from a catalog price. Estimates are not guaranteed sale prices. Data is stored in this browser only: back it up from the Data tab.</p>`};

V.inv=()=>V.dash()+`<h2>Inventory</h2><div class="c"><div class="f"><label>Search</label><input data-s="inv.q" data-live="inv" value="${esc(P.inv.q)}" placeholder="Name, set, number, location" type="search"></div>
<div class="g2"><div class="f"><label>Show</label><select data-s="inv.f" data-live="inv"><option value="all">All</option><option value="raw">Raw</option><option value="graded">Graded</option></select></div>
<div class="f"><label>Sort</label><select data-s="inv.s" data-live="inv"><option value="recent">Newest</option><option value="name">Name</option><option value="value">Value</option><option value="profit">Profit</option></select></div></div>
<div class="f"><label>Condition</label><select data-s="inv.c" data-live="inv"><option value="all">All conditions</option>${Object.keys(COND).map(c=>`<option value="${c}">${c} ${CN[c]}</option>`).join('')}</select></div><button class="p" style="width:100%" data-a="add">Add card</button></div><div class="c" id="list"></div>`;
function updInv(){const q=P.inv.q.toLowerCase();let L=S.inv.filter(i=>(P.inv.f==='all'||(P.inv.f==='graded')==!!i.co&&i.co!=='')&&(!P.inv.c||P.inv.c==='all'||(!i.co&&i.cond===P.inv.c))&&(!q||[i.name,i.set,i.number,i.loc,i.variant,i.notes].join(' ').toLowerCase().includes(q)));
const pf=i=>(n0(i.qty)||1)*(n0(i.market)-n0(i.cost));
if(P.inv.s==='name')L.sort((a,b)=>a.name.localeCompare(b.name));else if(P.inv.s==='value')L.sort((a,b)=>n0(b.market)*(n0(b.qty)||1)-n0(a.market)*(n0(a.qty)||1));else if(P.inv.s==='profit')L.sort((a,b)=>pf(b)-pf(a));else L=[...L].reverse();
const el=$('#list');if(!el)return;
el.innerHTML=L.length?L.map(i=>`<div class="item sr" data-a="edit" data-v="${i.id}">${i.img?`<img class="thumb" loading="lazy" alt="" src="${esc(i.img)}">`:''}<div style="min-width:0"><b>${esc(i.name)}</b> ${n0(i.qty)>1?`<span class="tag">×${esc(i.qty)}</span>`:''}${i.co?`<span class="tag">${esc(i.co)} ${esc(i.grade)}</span>`:`<span class="tag">${esc(i.cond||'Raw')}</span>`}<br>
<span class="mut">${esc([i.set,i.number,i.lang,i.variant,i.loc].filter(Boolean).join(' · '))}</span><br>
<span class="mut">Cost ${money(n0(i.cost))} · Market ${num(i.market)>0?money(num(i.market)):'not set'}${num(i.ask)>0?' · Ask '+money(num(i.ask)):''}</span>${num(i.market)>0?` · ${sgn(pf(i))}`:''}</div></div>`).join(''):
`<p class="mut">${S.inv.length?'No cards match this search or filter.':'Your inventory is empty. Tap Add card, or import a CSV from the Data tab.'}</p>`}

const FL=[['name','Card name','text'],['set','Set','text'],['number','Collector number (e.g. 161/131)','text'],['lang','Language','text'],['variant','Variant (holo, reverse, SIR...)','text'],['co','Grading company','s',['','PSA','BGS','CGC','Other']],['grade','Grade','text'],['cert','Cert number','text'],['cond','Raw condition','s',['NM','LP','MP','HP','DMG']],['qty','Quantity','n'],['cost','Cost per copy ($)','n'],['date','Acquired','date'],['market','Market value per copy ($)','n'],['ask','Your asking price ($)','n'],['loc','Storage location','text'],['notes','Notes','text']];
function form(it){it=it||{};const id=it.id||'';FX={img:it.img||'',cid:it.cid||''};$('#modal').innerHTML=`<div class="c"><h2>${id?'Edit card':'Add card'}</h2>${FL.map(([k,l,t,o])=>{const v=it[k]??(k==='qty'?'1':k==='lang'?'English':k==='cond'?'NM':k==='date'?today():'');
return `<div class="f"><label>${l}</label>${t==='s'?`<select id="f_${k}">${o.map(x=>`<option ${v==x?'selected':''} value="${x}">${x||'None (raw)'}</option>`).join('')}</select>`:`<input id="f_${k}" value="${esc(v)}" ${k==='set'?'list="setlist"':''} ${t==='n'?'inputmode="decimal"':t==='date'?'type="date"':''}>`}</div>`}).join('')}
<div class="row"><button class="p" data-a="saveitem" data-v="${id}">Save card</button><button data-a="close">Cancel</button></div>${id?`<button class="d" style="width:100%" data-a="delitem" data-v="${id}">${P.arm===id?'Tap again to delete':'Delete card'}</button>`:''}</div>`;$('#modal').style.display='block';$('#modal').scrollTop=0}

/* pricing lab */
function priceCalc(){const p=P.pr,inc=p.comps.filter(c=>!c.ex&&c.price>0),med=median(inc.map(c=>c.price)),src=[];
if(p.type==='raw'){if(inc.length)src.push(['eBay sold median',med,.6]);const pk=COND[p.cond||'NM']||1,sf=pk<1?' (NM × '+Math.round(pk*100)+'% for '+(p.cond)+')':'';if(num(p.tcg)>0)src.push(['TCGplayer Market'+sf,num(p.tcg)*pk,.25]);if(num(p.pc)>0)src.push(['PriceCharting'+sf,num(p.pc)*pk,.15])}
else{if(inc.length)src.push(['eBay graded sold median',med,.7]);if(num(p.guide)>0)src.push(['Grade-specific guide',num(p.guide),.3])}
if(!src.length)return{src,none:true};
const W=src.reduce((a,s)=>a+s[2],0),est=src.reduce((a,s)=>a+s[1]*s[2],0)/W,vs=src.map(s=>s[1]),ratio=Math.max(...vs)/Math.min(...vs);
const dated=inc.filter(c=>c.date).map(c=>(Date.now()-new Date(c.date))/864e5),why=[];let sc=0;
if(inc.length>=5){sc+=2;why.push(inc.length+' included sold comps')}else if(inc.length>=3){sc+=1;why.push(inc.length+' included sold comps')}else why.push('only '+inc.length+' included sold comp'+(inc.length==1?'':'s'));
if(dated.length&&median(dated)<=60){sc+=1;why.push('comps are recent (median '+Math.round(median(dated))+' days old)')}else why.push('comps are old or undated');
if(src.length>1){sc+=1;if(ratio<=1.15){sc+=1;why.push('sources agree within 15%')}else if(ratio>=1.35){sc-=2;why.push('sources disagree by '+Math.round((ratio-1)*100)+'%')}else why.push('sources differ moderately')}else why.push('single source');
let conf=sc>=4?'High':sc>=2?'Medium':'Low';if(src.length===1&&inc.length<3&&!(p.type==='raw'&&num(p.tcg)>0))conf='Insufficient data';
const w=conf==='High'?.08:conf==='Medium'?.15:.25,wid=w+(inc.length<3?.1:0);
return{src,W,est,conf,why,lo:Math.min(est*(1-wid),...vs),hi:Math.max(est*(1+wid),...vs),n:inc.length,wid}}
V.price=()=>{const p=P.pr,g=p.type==='graded',q=encodeURIComponent([p.name,p.set,p.num,g?p.co+' '+p.grade:''].filter(Boolean).join(' '));
return `<h2>Pricing Lab</h2><div class="c">${p.img?`<div class="sr" style="margin-bottom:10px"><img class="thumb" alt="" src="${esc(p.img)}"><div><b>${esc(p.name)}</b><br><span class="mut">${esc(p.set)} ${esc(p.num)}</span></div></div>`:''}<button style="width:100%;margin-bottom:10px" data-a="tab" data-v="search">Search card catalog</button><div class="row"><button class="chip ${!g?'on':''}" data-a="ptype" data-v="raw">Raw</button><button class="chip ${g?'on':''}" data-a="ptype" data-v="graded">Graded</button></div>${g?'':`<div class="k">Condition (guide prices are near mint and get scaled)</div><div class="row">${Object.keys(COND).map(c=>`<button class="chip ${(p.cond||'NM')===c?'on':''}" data-a="prcond" data-v="${c}">${c}</button>`).join('')}</div>`}
${inp('pr.name','Card name',{t:'text'})}<div class="g2">${inp('pr.set','Set (start typing)',{t:'text',list:1})}${inp('pr.num','Number',{t:'text'})}</div>
${g?`<div class="g2">${sel('pr.co','Company',['PSA','BGS','CGC','Other'])}${inp('pr.grade','Grade',{t:'text'})}</div>`:''}
<p class="mut" id="setinfo"></p><p class="mut">Confirm exact card, set, number, language and variant before trusting any value.</p>
<div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_Sold=1&LH_Complete=1">eBay sold</a><a class="btn" target="_blank" rel="noopener" href="https://www.ebay.com/sch/i.html?_nkw=${q}&LH_BIN=1">eBay Buy It Now</a>

const BAD=/\b(lot|bundle|proxy|custom|digital|reprint|replica|fake|damaged|code card|empty)\b/i;
async function autocomp(){const el=$('#pz');if(!el||!el.value.trim())return toast('Paste the eBay sold page text first.');const t=el.value,p=P.pr,g=p.type==='graded';
const tgt=[p.name,p.set,p.num,g?p.co+' '+p.grade:'raw, ungraded'].filter(Boolean).join(' | ');
$('#aimsg').textContent='Reading sold listings...';let it=null;
try{const s=await claude.use('sample');if(s){const r=await s.json('Target card: '+tgt+'\nBelow is text copied from an eBay sold-listings page. Extract every SOLD listing as a JSON array of {title, price, date, match, reason}. price = sold item price in USD as a number. date = sold date as YYYY-MM-DD (use year '+new Date().getFullYear()+' if missing) or "". match = true only if the listing is clearly the exact target card (same set, collector number, variant, language) and, if graded, the same company and grade; if raw, it must be ungraded and a single card. Otherwise match=false with a short reason (wrong grade, lot, different variant, custom, damaged, etc). Skip sponsored, active or similar-item listings. Return ONLY the JSON array.\n\n'+t.slice(0,15000));it=Array.isArray(r)?r:r&&r.items}}catch(e){}
if(!it){it=[];let d='',ti='';t.split('\n').map(x=>x.trim()).filter(Boolean).forEach(l=>{const m=l.match(/Sold\s+([A-Za-z]{3,9}\.?\s+\d{1,2},?\s*\d{4})/i);if(m){const x=new Date(m[1]);d=isNaN(x)?'':x.toISOString().slice(0,10)}else if(/^\$[\d,]+\.\d\d/.test(l)){if(ti){const bad=BAD.test(ti),gm=g?ti.toLowerCase().includes(p.co.toLowerCase())&&new RegExp('\\b'+p.grade+'\\b').test(ti):!/\b(psa|bgs|cgc|graded|slab)\b/i.test(ti);it.push({title:ti,price:l.match(/[\d,]+\.\d\d/)[0],date:d,match:!bad&&gm,reason:bad?'Lot, custom or damaged':'Different grade or graded status'});ti=''}}else if(l.length>25&&!/^(\+|Free|Buy|Best|Sponsored|Opens)/i.test(l))ti=l})}
const have=new Set(p.comps.map(c=>c.title+'|'+c.price+'|'+c.date));let n=0,x=0;
(it||[]).forEach(r=>{const pr=num(r.price);if(!(pr>0))return;const d=/^\d{4}-\d\d-\d\d$/.test(r.date||'')?r.date:'',k=(r.title||'')+'|'+pr+'|'+d;if(have.has(k))return;have.add(k);const ex=r.match===false;p.comps.push({price:pr,date:d,link:'',title:String(r.title||'').slice(0,90),ex,reason:ex?String(r.reason||'Not an exact match'):''});n++;if(ex)x++});
if(!n){$('#aimsg').textContent='No sold listings found in that text. Make sure you copied the Sold items page, or add comps manually below.';return}
el.value='';render();toast(n+' comps added, '+x+' auto-excluded. Check them against your card.')}
